name: Build Shake Expense APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Fix Gradle wrapper line endings
      - name: Fix Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # 4. Verify Gradle wrapper
      - name: Verify Gradle wrapper
        run: |
          ls -la gradlew
          file gradlew
          head -n 1 gradlew

      # 5. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

      # 6. Verify APK exists
      - name: Verify APK
        run: |
          echo "Checking APK output..."
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # 7. Rename APK
      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk \
            apk-output/ShakeExpense-v1.0-build${{ github.run_number }}.apk

          echo "APK_PATH=apk-output/ShakeExpense-v1.0-build${{ github.run_number }}.apk" >> $GITHUB_ENV

      # 8. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakeExpense-APK-build${{ github.run_number }}
          path: apk-output/ShakeExpense-v1.0-build${{ github.run_number }}.apk
          retention-days: 30

      # 9. Build summary
      - name: Build Summary
        run: |
          echo "## Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ShakeExpense-v1.0-build${{ github.run_number }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Go to Actions → this run → Artifacts" >> $GITHUB_STEP_SUMMARY