name: Build Shake Expense APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required by Android Gradle Plugin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Grant execute permission to Gradle wrapper
      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      # 4. Cache Gradle files for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

      # 6. Rename APK to include build number
      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/ShakeExpense-v1.0-build${{ github.run_number }}.apk
          echo "APK_PATH=apk-output/ShakeExpense-v1.0-build${{ github.run_number }}.apk" >> $GITHUB_ENV

      # 7. Upload APK as downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShakeExpense-APK-build${{ github.run_number }}
          path: apk-output/ShakeExpense-v1.0-build${{ github.run_number }}.apk
          retention-days: 30

      # 8. Print success summary
      - name: Build Summary
        run: |
          echo "## Build Successful! " >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ShakeExpense-v1.0-build${{ github.run_number }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** Go to Actions tab -> this run -> Artifacts section" >> $GITHUB_STEP_SUMMARY
